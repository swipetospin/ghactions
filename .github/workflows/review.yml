name: Claude Code Review

permissions:
  contents: read
  id-token: write
  pull-requests: write

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
        
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }} 
          claude_args: "--model claude-opus-5-5 --dangerously-skip-permissions"
          show_full_output: true
          prompt: |
            Review only the files changed in this PR (use `gh pr diff ${{ github.event.pull_request.number }} --name-only` to identify them).

            Before reviewing, run the following commands and read the output to understand what has already been flagged or discussed:
              `gh pr view ${{ github.event.pull_request.number }} --json comments,reviews`
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
              `gh api graphql -F owner='${{ github.repository_owner }}' -F repo='${{ github.event.repository.name }}' -F number=${{ github.event.pull_request.number }} -f query='query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $number) { reviewThreads(first: 100) { nodes { isResolved path line comments(first: 1) { nodes { databaseId body } } } } } } }'`

            Then read `.github/review/instructions.md` and follow the rest of the review instructions there.